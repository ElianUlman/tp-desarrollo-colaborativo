<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ideas Último Año</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header class="navbar">

            <h2>Ideas Último Año</h2>
            
            <nav>
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Propuestas</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>

        </header>

        <main>
            <div class="hero">

                <h1>Propuestas para el último año</h1>
                <p>Votá ideas para hacer este último año inolvidable.</p>

                <button id="votar">Apoyar esta idea</button>
                

                <p id="contador">Votos: 0</p>

            </div>


            <div class="propuesta">

                <h2>Enviar una propuesta</h2>

                <form id="formPropuesta">

                    <label>Tu nombre</label>
                    <input type="text" id="nombre">

                    <label>Tu propuesta</label>
                    <input type="text" id="idea">
                    

                    <button>Enviar propuesta</button>

                    <p id="mensaje"></p>

                </form>

            </div>

            <div class="ultimaPropuesta">
                <h2>Última propuesta enviada</h2>
                <p id="ultimaPropuesta">No hay propuestas</p>
                <p id="nombreUltimaPropuesta"></p>
            </div>
            
        </main>
        
        <footer>

            <p>Promoción 2026</p>

            <div class="redesLink">
                <h5>Nuestras redes</h5>
                <ul>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">Twitter</a></li>
                    <li><a href="#">Facebook</a></li>
                </ul>
            </div>

        </footer>

        <script src="script.js"></script>

    </body>
</html>
